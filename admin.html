<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — 기받아가요</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;
           background:#f0f9ff; color:#0c4a6e; min-height:100vh; }

    /* ── 헤더 ── */
    header { background:#fff; border-bottom:1px solid #bae6fd;
             padding:14px 20px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
    header h1 { font-size:17px; font-weight:800; color:#0369a1; }
    .badge { background:#0ea5e9; color:#fff; font-size:11px; font-weight:700;
             padding:2px 8px; border-radius:20px; letter-spacing:1px; }
    .btn-out { background:none; border:1px solid #bae6fd; border-radius:20px;
               padding:5px 12px; font-size:12px; color:#7dd3fc; cursor:pointer; margin-left:auto; }

    /* ── 탭 바 ── */
    .tab-bar { display:flex; background:#fff; border-bottom:1px solid #e0f2fe;
               position:sticky; top:49px; z-index:9; }
    .tab-btn { flex:1; padding:13px 8px; border:none; background:none;
               font-size:13px; font-weight:600; color:#7dd3fc; cursor:pointer;
               border-bottom:2px solid transparent; transition:.2s; }
    .tab-btn.active { color:#0369a1; border-bottom-color:#0ea5e9; }

    /* ── 컨테이너 ── */
    .container { max-width:560px; margin:0 auto; padding:20px 16px 60px; }

    /* ── 탭 패널 ── */
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── 인증 섹션 ── */
    #sec-login { text-align:center; padding:60px 20px; }
    #sec-login p { font-size:15px; color:#7dd3fc; margin-bottom:24px; }
    .btn-google { display:inline-flex; align-items:center; gap:10px; background:#fff;
                  border:1.5px solid #bae6fd; border-radius:50px; padding:12px 24px;
                  font-size:15px; font-weight:600; color:#0369a1; cursor:pointer;
                  box-shadow:0 2px 10px rgba(14,165,233,.15); }
    #sec-blocked { text-align:center; padding:60px 20px; }
    #sec-blocked .icon { font-size:48px; margin-bottom:12px; }
    #sec-blocked h2 { font-size:18px; color:#0369a1; margin-bottom:8px; }
    #sec-blocked p { font-size:14px; color:#7dd3fc; line-height:1.7; }
    #sec-blocked code { background:#e0f2fe; padding:2px 8px; border-radius:6px; font-size:13px; }

    /* ── 카드 ── */
    .card { background:#fff; border:1px solid #bae6fd; border-radius:18px;
            box-shadow:0 4px 18px rgba(14,165,233,.08); padding:20px; margin-bottom:16px; }
    .card h2 { font-size:15px; font-weight:700; color:#0369a1; margin-bottom:14px; }

    /* ── UID 박스 ── */
    .uid-box { background:#f0f9ff; border:1px solid #bae6fd; border-radius:12px;
               padding:12px 16px; margin-bottom:16px; font-size:13px; }
    .uid-box .label { color:#7dd3fc; font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
    .uid-val { font-family:monospace; color:#0369a1; word-break:break-all; cursor:pointer; }
    .uid-val:hover { text-decoration:underline; }
    .uid-hint { font-size:11px; color:#bae6fd; margin-top:2px; }

    /* ── 글쓰기 ── */
    textarea { width:100%; min-height:130px; border:1.5px solid #bae6fd; border-radius:14px;
               padding:14px; font-size:15px; color:#0c4a6e; resize:none; outline:none;
               font-family:inherit; background:#fff; transition:border-color .2s; margin-bottom:6px; }
    textarea:focus { border-color:#0ea5e9; }
    textarea::placeholder { color:#bae6fd; }
    .char-count { text-align:right; font-size:12px; color:#7dd3fc; margin-bottom:14px; }
    .btn-submit { width:100%; padding:14px; border-radius:40px; border:none;
                  font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .btn-submit.on  { background:linear-gradient(135deg,#38bdf8,#0ea5e9,#0369a1); color:#fff; }
    .btn-submit.off { background:#e0f2fe; color:#bae6fd; cursor:default; }

    /* ── 자랑글 목록 ── */
    .post-item { padding:14px 0; border-bottom:1px solid #e0f2fe; }
    .post-item:last-child { border-bottom:none; }
    .post-meta { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
    .post-meta .who { font-size:12px; color:#7dd3fc; }
    .post-meta .rem { font-size:12px; color:#0ea5e9; font-weight:600; margin-left:auto; }
    .post-uid  { font-size:10px; color:#94a3b8; margin-bottom:4px; font-family:monospace; }
    .post-text { font-size:14px; color:#0c4a6e; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
    .post-date { font-size:11px; color:#bae6fd; margin-top:4px; }
    .btn-delete { background:none; border:1px solid #fca5a5; border-radius:16px;
                  padding:3px 10px; font-size:12px; color:#ef4444; cursor:pointer;
                  transition:background .15s; white-space:nowrap; }
    .btn-delete:hover { background:#fee2e2; }

    /* ── 회원 목록 ── */
    .user-item { padding:14px 0; border-bottom:1px solid #e0f2fe; }
    .user-item:last-child { border-bottom:none; }
    .user-item-header { display:flex; align-items:center; gap:10px; }
    .user-info { flex:1; min-width:0; cursor:pointer; }
    .user-info:hover .user-name { text-decoration:underline; }
    .user-name { font-size:14px; font-weight:700; color:#0c4a6e; }
    .user-meta { font-size:12px; color:#7dd3fc; margin-top:2px; }
    .user-uid  { font-size:10px; color:#94a3b8; font-family:monospace; margin-top:2px; }
    .user-banned { font-size:11px; color:#ef4444; font-weight:700; margin-left:6px; }
    .user-posts { margin-top:10px; padding-left:10px; border-left:2px solid #e0f2fe; display:none; }
    .user-post-item { padding:7px 0; border-bottom:1px solid #f0f9ff; }
    .user-post-item:last-child { border-bottom:none; }
    .user-post-meta { font-size:11px; color:#7dd3fc; margin-bottom:3px; }
    .user-post-text { font-size:13px; color:#0c4a6e; line-height:1.5; white-space:pre-wrap; word-break:break-all; }
    .btn-ban   { background:none; border:1px solid #fca5a5; border-radius:16px;
                 padding:4px 12px; font-size:12px; color:#ef4444; cursor:pointer;
                 transition:background .15s; white-space:nowrap; flex-shrink:0; }
    .btn-ban:hover   { background:#fee2e2; }
    .btn-unban { background:none; border:1px solid #bae6fd; border-radius:16px;
                 padding:4px 12px; font-size:12px; color:#0ea5e9; cursor:pointer;
                 transition:background .15s; white-space:nowrap; flex-shrink:0; }
    .btn-unban:hover { background:#e0f2fe; }

    .empty-msg { text-align:center; padding:24px; font-size:14px; color:#bae6fd; }

    /* ── 토스트 ── */
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
             background:rgba(12,74,110,.92); color:#fff; padding:10px 22px;
             border-radius:28px; font-size:14px; font-weight:600;
             opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; z-index:100; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>

<header>
  <h1>기받아가요</h1>
  <span class="badge">ADMIN</span>
  <button class="btn-out" id="btn-out" style="display:none" onclick="signOut()">로그아웃</button>
</header>

<!-- 탭 바 (로그인 후에만 보임) -->
<div class="tab-bar" id="tab-bar" style="display:none">
  <button class="tab-btn active" id="tbtn-post" onclick="switchTab('post')">📮 자랑글</button>
  <button class="tab-btn"        id="tbtn-user" onclick="switchTab('user')">👥 회원 관리</button>
  <button class="tab-btn"        id="tbtn-info" onclick="switchTab('info')">⚙️ 정보</button>
</div>

<div class="container">

  <!-- 로그인 전 -->
  <div id="sec-login">
    <p>관리자 계정으로 Google 로그인하세요.</p>
    <button class="btn-google" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google로 로그인
    </button>
  </div>

  <!-- 접근 차단 -->
  <div id="sec-blocked" style="display:none">
    <div class="icon">🚫</div>
    <h2>접근 권한 없음</h2>
    <p>관리자 UID가 일치하지 않아요.<br>
       <code>admin.html</code>의 <code>ADMIN_UID</code>를 확인해주세요.</p>
  </div>

  <!-- 관리자 패널 -->
  <div id="sec-admin" style="display:none">

    <!-- ── 탭: 자랑글 ── -->
    <div id="panel-post" class="tab-panel active">

      <div class="card">
        <h2>📮 자랑글 작성 (기 소모 없음)</h2>
        <textarea id="txt" maxlength="300" placeholder="자랑글 내용을 입력하세요..."></textarea>
        <div class="char-count"><span id="cnt">0</span> / 300</div>
        <button class="btn-submit off" id="btn-post" onclick="post()">✨ 자랑글 배달하기</button>
      </div>

      <div class="card">
        <h2>📋 최근 자랑글 (20개)</h2>
        <div id="post-list"><div class="empty-msg">불러오는 중...</div></div>
      </div>

    </div>

    <!-- ── 탭: 회원 관리 ── -->
    <div id="panel-user" class="tab-panel">
      <div class="card">
        <h2>👥 회원 목록 (기 많은 순) <span id="user-count" style="font-size:13px;font-weight:400;color:#7dd3fc;"></span></h2>
        <div id="user-list"><div class="empty-msg">불러오는 중...</div></div>
      </div>
    </div>

    <!-- ── 탭: 정보 ── -->
    <div id="panel-info" class="tab-panel">
      <div class="uid-box">
        <div class="label">내 UID (클릭하면 복사)</div>
        <div class="uid-val" id="my-uid" onclick="copyUid()"></div>
        <div class="uid-hint">이 값을 ADMIN_UID에 붙여넣으면 다음부터 자동 인증됩니다</div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyDXUtzrvsfTiR912OlRN7yvcK9lzKFhJKQ",
  authDomain:        "ki-badagayo.firebaseapp.com",
  projectId:         "ki-badagayo",
  storageBucket:     "ki-badagayo.firebasestorage.app",
  messagingSenderId: "625726911035",
  appId:             "1:625726911035:web:6e2ef8818b901ad613621e"
};

const ADMIN_UID = 'WS3FQ9JICAYPgibggl2bEgNG3Bv2';

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let me = null;

const today = () => new Date().toLocaleDateString('sv-SE');
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ─── Auth ─── */
function signIn() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => toast('로그인 실패: ' + e.message));
}
function signOut() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  me = user;
  document.getElementById('btn-out').style.display = user ? '' : 'none';

  if (!user) { showSec('sec-login'); return; }

  document.getElementById('my-uid').textContent = user.uid;

  const allowed = !ADMIN_UID || ADMIN_UID === user.uid;
  if (!allowed) { showSec('sec-blocked'); return; }

  showSec('sec-admin');
  document.getElementById('tab-bar').style.display = 'flex';
  loadPosts();
  loadUsers();
});

function showSec(id) {
  ['sec-login','sec-blocked','sec-admin'].forEach(s =>
    document.getElementById(s).style.display = s === id ? '' : 'none'
  );
  if (id !== 'sec-admin') document.getElementById('tab-bar').style.display = 'none';
}

/* ─── 탭 전환 ─── */
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  document.getElementById(`tbtn-${name}`).classList.add('active');
}

/* ─── UID 복사 ─── */
function copyUid() {
  const uid = document.getElementById('my-uid').textContent;
  navigator.clipboard?.writeText(uid).then(() => toast('UID 복사됨!')).catch(() => toast(uid));
}

/* ─── 자랑글 작성 ─── */
document.getElementById('txt').addEventListener('input', function() {
  document.getElementById('cnt').textContent = this.value.length;
  updateBtn();
});

function updateBtn() {
  const ok = document.getElementById('txt').value.trim().length > 0;
  document.getElementById('btn-post').className = 'btn-submit ' + (ok ? 'on' : 'off');
}

async function post() {
  const content = document.getElementById('txt').value.trim();
  if (!content || !me) return;

  const btn = document.getElementById('btn-post');
  btn.disabled = true; btn.textContent = '배달 중...';

  try {
    await db.collection('posts').add({
      authorId: me.uid, authorName: '관리자', content,
      date: today(), kiPool: 9999, kiRemaining: 9999,
      isAdmin: true, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('txt').value = '';
    document.getElementById('cnt').textContent = '0';
    toast('자랑글을 배달했어요!');
    loadPosts();
  } catch(e) { toast('오류: ' + e.message); }
  finally { btn.disabled = false; updateBtn(); }
}

/* ─── 자랑글 목록 ─── */
async function loadPosts() {
  const list = document.getElementById('post-list');
  list.innerHTML = '<div class="empty-msg">불러오는 중...</div>';
  try {
    const snap = await db.collection('posts').orderBy('createdAt', 'desc').limit(20).get();
    if (snap.empty) { list.innerHTML = '<div class="empty-msg">아직 자랑글이 없어요.</div>'; return; }

    list.innerHTML = '';
    snap.docs.forEach(d => {
      const p = d.data();
      const ts = p.createdAt?.toDate?.()?.toLocaleString('ko-KR') || '';
      const item = document.createElement('div');
      item.className = 'post-item'; item.id = `item-${d.id}`;
      item.innerHTML = `
        <div class="post-meta">
          <span class="who">${esc(p.authorName)}${p.isAdmin ? ' 👑' : ''}${p.authorBanned ? ' 🚫' : ''}</span>
          <span class="rem">🔮 ${p.kiRemaining}/${p.kiPool}기</span>
          <button class="btn-delete" onclick="deletePost('${d.id}')">🗑 삭제</button>
        </div>
        <div class="post-uid">UID: ${esc(p.authorId)}</div>
        <div class="post-text">${esc(p.content)}</div>
        <div class="post-date">${ts}</div>`;
      list.appendChild(item);
    });
  } catch(e) { list.innerHTML = `<div class="empty-msg">오류: ${esc(e.message)}</div>`; }
}

/* ─── 자랑글 삭제 ─── */
async function deletePost(postId) {
  if (!confirm('이 자랑글을 삭제할까요?')) return;
  try {
    await db.collection('posts').doc(postId).delete();
    document.getElementById(`item-${postId}`)?.remove();
    toast('삭제됐어요');
    if (!document.getElementById('post-list').querySelector('.post-item'))
      document.getElementById('post-list').innerHTML = '<div class="empty-msg">아직 자랑글이 없어요.</div>';
  } catch(e) { toast('삭제 실패: ' + e.message); }
}

/* ─── 회원 목록 ─── */
async function loadUsers() {
  const list = document.getElementById('user-list');
  list.innerHTML = '<div class="empty-msg">불러오는 중...</div>';
  try {
    const snap = await db.collection('users').orderBy('kiBalance', 'desc').limit(50).get();
    if (snap.empty) { list.innerHTML = '<div class="empty-msg">회원이 없어요.</div>'; return; }

    document.getElementById('user-count').textContent = `총 ${snap.size}명`;
    list.innerHTML = '';
    snap.docs.forEach(d => {
      const u = d.data();
      const isBanned = u.banned === true;
      const item = document.createElement('div');
      item.className = 'user-item'; item.id = `user-${d.id}`;
      item.innerHTML = `
        <div class="user-item-header">
          <div class="user-info" onclick="toggleUserPosts('${d.id}')">
            <div class="user-name">${esc(u.displayName || '(이름없음)')}${isBanned ? '<span class="user-banned"> 🚫 차단됨</span>' : ''}</div>
            <div class="user-meta">기 ${u.kiBalance ?? 0}개 보유</div>
            <div class="user-uid">${d.id}</div>
          </div>
          ${isBanned
            ? `<button class="btn-unban" onclick="unbanUser('${d.id}')">차단 해제</button>`
            : `<button class="btn-ban"   onclick="banUser('${d.id}')">차단</button>`}
        </div>
        <div class="user-posts" id="uposts-${d.id}"></div>`;
      list.appendChild(item);
    });
  } catch(e) { list.innerHTML = `<div class="empty-msg">오류: ${esc(e.message)}</div>`; }
}

/* ─── 회원 글 목록 토글 ─── */
async function toggleUserPosts(uid) {
  const el = document.getElementById(`uposts-${uid}`);
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div class="empty-msg" style="padding:8px;font-size:12px">불러오는 중...</div>';
  try {
    const snap = await db.collection('posts').where('authorId', '==', uid).orderBy('createdAt', 'desc').get();
    if (snap.empty) { el.innerHTML = '<div class="empty-msg" style="padding:8px;font-size:12px">글이 없어요.</div>'; return; }
    el.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const ts = p.createdAt?.toDate?.()?.toLocaleString('ko-KR') || '';
      return `<div class="user-post-item">
        <div class="user-post-meta">🔮 ${p.kiRemaining}/${p.kiPool}기 · ${ts}</div>
        <div class="user-post-text">${esc(p.content)}</div>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = `<div class="empty-msg" style="padding:8px;font-size:12px">오류: ${esc(e.message)}</div>`; }
}

/* ─── 차단 / 해제 ─── */
async function banUser(uid) {
  if (!confirm('이 회원을 차단할까요? 자랑글을 쓸 수 없고 기존 글도 배달되지 않습니다.')) return;
  try {
    const batch = db.batch();
    batch.update(db.collection('users').doc(uid), { banned: true });
    const posts = await db.collection('posts').where('authorId', '==', uid).get();
    posts.forEach(d => batch.update(d.ref, { authorBanned: true }));
    await batch.commit();
    toast('차단됐어요'); loadUsers();
  } catch(e) { toast('오류: ' + e.message); }
}

async function unbanUser(uid) {
  if (!confirm('차단을 해제할까요?')) return;
  try {
    const batch = db.batch();
    batch.update(db.collection('users').doc(uid), { banned: false });
    const posts = await db.collection('posts').where('authorId', '==', uid).get();
    posts.forEach(d => batch.update(d.ref, { authorBanned: false }));
    await batch.commit();
    toast('차단 해제됐어요'); loadUsers();
  } catch(e) { toast('오류: ' + e.message); }
}
</script>
</body>
</html>
