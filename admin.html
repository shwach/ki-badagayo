<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — 기받아가요</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;
           background:#f0f9ff; color:#0c4a6e; min-height:100vh; }

    header { background:#fff; border-bottom:1px solid #bae6fd;
             padding:16px 24px; display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; font-weight:800; color:#0369a1; }
    header .badge { background:#0ea5e9; color:#fff; font-size:11px; font-weight:700;
                    padding:2px 8px; border-radius:20px; letter-spacing:1px; }

    .container { max-width:560px; margin:0 auto; padding:28px 20px 60px; }

    /* 로그인 섹션 */
    #sec-login { text-align:center; padding:60px 20px; }
    #sec-login p { font-size:15px; color:#7dd3fc; margin-bottom:24px; }
    .btn-google { display:inline-flex; align-items:center; gap:10px; background:#fff;
                  border:1.5px solid #bae6fd; border-radius:50px; padding:12px 24px;
                  font-size:15px; font-weight:600; color:#0369a1; cursor:pointer;
                  box-shadow:0 2px 10px rgba(14,165,233,.15); }

    /* 관리자 정보 */
    #sec-uid { background:#fff; border:1px solid #bae6fd; border-radius:14px;
               padding:14px 18px; margin-bottom:20px; font-size:13px; }
    #sec-uid .label { color:#7dd3fc; margin-bottom:4px; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
    #sec-uid .uid-val { font-family:monospace; font-size:13px; color:#0369a1;
                        word-break:break-all; cursor:pointer; }
    #sec-uid .uid-val:hover { text-decoration:underline; }
    #sec-uid .copy-hint { font-size:11px; color:#bae6fd; margin-top:2px; }

    /* 접근 차단 */
    #sec-blocked { text-align:center; padding:60px 20px; }
    #sec-blocked .icon { font-size:48px; margin-bottom:12px; }
    #sec-blocked h2 { font-size:18px; color:#0369a1; margin-bottom:8px; }
    #sec-blocked p { font-size:14px; color:#7dd3fc; line-height:1.7; }
    #sec-blocked code { background:#e0f2fe; padding:2px 8px; border-radius:6px; font-size:13px; }

    /* 글쓰기 카드 */
    .card { background:#fff; border:1px solid #bae6fd; border-radius:18px;
            box-shadow:0 4px 18px rgba(14,165,233,.08); padding:22px; margin-bottom:20px; }
    .card h2 { font-size:16px; font-weight:700; color:#0369a1; margin-bottom:16px; }

    /* ki 피커 */
    .ki-row { display:flex; align-items:center; gap:0; margin-bottom:6px; }
    .kp-btn { width:40px; height:40px; border-radius:50%; border:1.5px solid #bae6fd;
              background:#f0f9ff; font-size:20px; color:#0ea5e9; cursor:pointer;
              display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .kp-btn:hover { background:#bae6fd; }
    .kp-mid { flex:1; text-align:center; }
    .kp-num { font-size:40px; font-weight:900; color:#0ea5e9; line-height:1; }
    .kp-unit { font-size:13px; color:#7dd3fc; }
    .ki-hint { font-size:12px; color:#7dd3fc; margin-bottom:18px; text-align:center; }

    textarea { width:100%; min-height:140px; border:1.5px solid #bae6fd; border-radius:14px;
               padding:14px; font-size:15px; color:#0c4a6e; resize:none; outline:none;
               font-family:inherit; background:#fff; transition:border-color .2s; margin-bottom:6px; }
    textarea:focus { border-color:#0ea5e9; }
    textarea::placeholder { color:#bae6fd; }
    .char-count { text-align:right; font-size:12px; color:#7dd3fc; margin-bottom:16px; }

    .btn-submit { width:100%; padding:15px; border-radius:40px; border:none;
                  font-size:16px; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .btn-submit.on  { background:linear-gradient(135deg,#38bdf8,#0ea5e9,#0369a1); color:#fff; }
    .btn-submit.off { background:#e0f2fe; color:#bae6fd; cursor:default; }

    /* 최근 글 목록 */
    .post-item { padding:14px 0; border-bottom:1px solid #e0f2fe; }
    .post-item:last-child { border-bottom:none; }
    .post-meta { display:flex; justify-content:space-between; margin-bottom:6px; }
    .post-meta .who  { font-size:12px; color:#7dd3fc; }
    .post-meta .rem  { font-size:12px; color:#0ea5e9; font-weight:600; }
    .post-text { font-size:14px; color:#0c4a6e; line-height:1.6;
                 white-space:pre-wrap; word-break:break-all; }
    .post-date { font-size:11px; color:#bae6fd; margin-top:4px; }
    .empty-posts { text-align:center; padding:24px; font-size:14px; color:#bae6fd; }
    .btn-delete { background:none; border:1px solid #fca5a5; border-radius:16px;
                  padding:4px 12px; font-size:12px; color:#ef4444; cursor:pointer;
                  transition:background .15s; white-space:nowrap; }
    .btn-delete:hover { background:#fee2e2; }

    /* 토스트 */
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
             background:rgba(12,74,110,.92); color:#fff; padding:10px 22px;
             border-radius:28px; font-size:14px; font-weight:600;
             opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
    #toast.show { opacity:1; }

    .btn-out { background:none; border:1px solid #bae6fd; border-radius:20px;
               padding:6px 14px; font-size:12px; color:#7dd3fc; cursor:pointer; margin-left:auto; }
  </style>
</head>
<body>

<header>
  <h1>기받아가요</h1>
  <span class="badge">ADMIN</span>
  <button class="btn-out" id="btn-out" style="display:none" onclick="signOut()">로그아웃</button>
</header>

<div class="container">

  <!-- 로그인 전 -->
  <div id="sec-login">
    <p>관리자 계정으로 Google 로그인하세요.</p>
    <button class="btn-google" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google로 로그인
    </button>
  </div>

  <!-- 접근 차단 (UID 불일치) -->
  <div id="sec-blocked" style="display:none">
    <div class="icon">🚫</div>
    <h2>접근 권한 없음</h2>
    <p>관리자 UID가 일치하지 않아요.<br>
       <code>admin.html</code> 상단의<br>
       <code>ADMIN_UID</code>에 내 UID를 입력해주세요.</p>
  </div>

  <!-- 관리자 패널 -->
  <div id="sec-admin" style="display:none">

    <!-- 내 UID -->
    <div id="sec-uid">
      <div class="label">내 UID (클릭하면 복사)</div>
      <div class="uid-val" id="my-uid" onclick="copyUid()"></div>
      <div class="copy-hint">이 값을 ADMIN_UID에 붙여넣으면 다음부터 자동 인증됩니다</div>
    </div>

    <!-- 자랑글 작성 -->
    <div class="card">
      <h2>📮 자랑글 작성 (관리자 — 기 소모 없음)</h2>


      <textarea id="txt" maxlength="300" placeholder="자랑글 내용을 입력하세요..."></textarea>
      <div class="char-count"><span id="cnt">0</span> / 300</div>
      <button class="btn-submit off" id="btn-post" onclick="post()">✨ 자랑글 배달하기</button>
    </div>

    <!-- 최근 자랑글 -->
    <div class="card">
      <h2>📋 최근 자랑글 목록</h2>
      <div id="post-list"><div class="empty-posts">불러오는 중...</div></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════
   ① Firebase 설정 — index.html과 동일한 값 붙여넣기
   ══════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyDXUtzrvsfTiR912OlRN7yvcK9lzKFhJKQ",
  authDomain:        "ki-badagayo.firebaseapp.com",
  projectId:         "ki-badagayo",
  storageBucket:     "ki-badagayo.firebasestorage.app",
  messagingSenderId: "625726911035",
  appId:             "1:625726911035:web:6e2ef8818b901ad613621e"
};

/* ══════════════════════════════════
   ② 관리자 UID — 로그인 후 아래 표시되는 UID를 복사해서 넣으세요
      비워두면 Google 로그인한 사람 누구나 접근 가능 (첫 설정용)
   ══════════════════════════════════ */
const ADMIN_UID = 'WS3FQ9JICAYPgibggl2bEgNG3Bv2';
/* ══════════════════════════════════ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let me = null;

const today = () => new Date().toLocaleDateString('sv-SE');
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ─── Auth ─── */
function signIn() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => toast('로그인 실패: ' + e.message));
}
function signOut() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  me = user;
  document.getElementById('btn-out').style.display = user ? '' : 'none';

  if (!user) {
    show('sec-login'); return;
  }
  // UID 표시
  document.getElementById('my-uid').textContent = user.uid;

  // 권한 확인: ADMIN_UID가 비어있으면 누구나 허용 (최초 설정용)
  const allowed = !ADMIN_UID || ADMIN_UID === user.uid;
  if (!allowed) { show('sec-blocked'); return; }

  show('sec-admin');
  loadPosts();
});

function show(id) {
  ['sec-login','sec-blocked','sec-admin'].forEach(s =>
    document.getElementById(s).style.display = s === id ? '' : 'none'
  );
}

/* ─── UID 복사 ─── */
function copyUid() {
  const uid = document.getElementById('my-uid').textContent;
  navigator.clipboard?.writeText(uid).then(() => toast('UID 복사됨!')).catch(() => {
    toast(uid); // 클립보드 API 없으면 토스트로 표시
  });
}


document.getElementById('txt').addEventListener('input', function() {
  document.getElementById('cnt').textContent = this.value.length;
  updateBtn();
});

function updateBtn() {
  const ok = document.getElementById('txt').value.trim().length > 0;
  const btn = document.getElementById('btn-post');
  btn.className = 'btn-submit ' + (ok ? 'on' : 'off');
  btn.textContent = ok ? '✨ 자랑글 배달하기' : '✨ 자랑글 배달하기';
}

/* ─── 자랑글 작성 (관리자 — 기 소모 없음) ─── */
async function post() {
  const content = document.getElementById('txt').value.trim();
  if (!content || !me) return;

  const btn = document.getElementById('btn-post');
  btn.disabled = true; btn.textContent = '배달 중...';

  try {
    await db.collection('posts').add({
      authorId:    me.uid,
      authorName:  '관리자',
      content,
      date:        today(),
      kiPool:      9999,
      kiRemaining: 9999,
      isAdmin:     true,
      createdAt:   firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('txt').value = '';
    document.getElementById('cnt').textContent = '0';
    toast('자랑글을 배달했어요!');
    loadPosts();
  } catch(e) {
    toast('오류: ' + e.message);
  } finally {
    btn.disabled = false;
    updateBtn();
  }
}

/* ─── 자랑글 삭제 ─── */
async function deletePost(postId) {
  if (!confirm('이 자랑글을 삭제할까요?')) return;
  try {
    await db.collection('posts').doc(postId).delete();
    document.getElementById(`item-${postId}`)?.remove();
    toast('삭제됐어요');
    // 목록이 비었으면 안내 문구 표시
    if (!document.getElementById('post-list').querySelector('.post-item')) {
      document.getElementById('post-list').innerHTML = '<div class="empty-posts">아직 자랑글이 없어요.</div>';
    }
  } catch(e) {
    toast('삭제 실패: ' + e.message);
  }
}

/* ─── 최근 자랑글 목록 ─── */
async function loadPosts() {
  const list = document.getElementById('post-list');
  list.innerHTML = '<div class="empty-posts">불러오는 중...</div>';

  try {
    const snap = await db.collection('posts')
      .orderBy('createdAt', 'desc')
      .limit(20)
      .get();

    if (snap.empty) {
      list.innerHTML = '<div class="empty-posts">아직 자랑글이 없어요.</div>';
      return;
    }

    list.innerHTML = '';
    snap.docs.forEach(d => {
      const p = d.data();
      const ts = p.createdAt?.toDate?.()?.toLocaleString('ko-KR') || '';
      const item = document.createElement('div');
      item.className = 'post-item';
      item.id = `item-${d.id}`;
      item.innerHTML = `
        <div class="post-meta">
          <span class="who">${esc(p.authorName)}${p.isAdmin ? ' 👑' : ''}</span>
          <span class="rem">🔮 ${p.kiRemaining}/${p.kiPool}기 남음</span>
          <button class="btn-delete" onclick="deletePost('${d.id}')">🗑 삭제</button>
        </div>
        <div class="post-text">${esc(p.content)}</div>
        <div class="post-date">${ts}</div>`;
      list.appendChild(item);
    });
  } catch(e) {
    list.innerHTML = `<div class="empty-posts">오류: ${esc(e.message)}</div>`;
  }
}
</script>
</body>
</html>
