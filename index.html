<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e0f2fe">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>기받아가요</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --sky:   #0ea5e9;
      --sky-l: #38bdf8;
      --sky-ll:#bae6fd;
      --sky-d: #0369a1;
      --sky-dd:#075985;
      --bg:    #f0f9ff;
      --text:  #0c4a6e;
      --muted: #7dd3fc;
      --card:  rgba(255,255,255,.9);
      --cb:    rgba(125,211,252,.4);
    }

    html, body { height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif; color:var(--text); overflow:hidden; }

    /* ── 🙏 배경 ── */
    #hands { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .hand  { position:absolute; bottom:-60px; font-size:var(--sz); opacity:0;
             animation:riseHand var(--d) ease-in-out infinite var(--dl); user-select:none; }
    @keyframes riseHand {
      0%   { transform:translateY(0)      rotate(0deg);  opacity:0;   }
      12%  { opacity:.12; }
      50%  { transform:translateY(-52vh)  rotate(5deg);  }
      88%  { opacity:.06; }
      100% { transform:translateY(-115vh) rotate(-4deg); opacity:0;   }
    }

    /* ── 페이지 공통 ── */
    .page { display:none; position:fixed; inset:0; overflow-y:auto;
            background:radial-gradient(ellipse at 50% -5%,rgba(125,211,252,.38) 0%,transparent 56%),
                       linear-gradient(180deg,#ddf1fc 0%,#fff 45%,var(--bg) 100%); z-index:1; }
    .page.active { display:flex; flex-direction:column; align-items:center; }

    /* ── 로딩 ── */
    #pg-loading { justify-content:center; }
    .spin-orb { width:76px; height:76px; border-radius:50%;
                background:radial-gradient(circle at 35% 30%,#fff,#bae6fd 25%,#38bdf8 55%,var(--sky-d));
                box-shadow:0 0 38px rgba(14,165,233,.5); animation:pulse 1.7s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
    #pg-loading p { margin-top:14px; color:var(--muted); font-size:14px; }

    /* ── 로그인 ── */
    #pg-login { justify-content:center; padding:40px 32px; text-align:center; }
    .login-orb { width:128px; height:128px; border-radius:50%; margin:0 auto 28px; position:relative;
                 background:radial-gradient(circle at 35% 28%,#fff 0%,#e0f2fe 13%,#bae6fd 29%,#38bdf8 50%,var(--sky) 65%,var(--sky-d) 82%,var(--sky-dd) 100%);
                 box-shadow:0 0 50px rgba(14,165,233,.6),0 0 90px rgba(14,165,233,.22);
                 animation:float3d 4s ease-in-out infinite; }
    .login-orb::before { content:''; position:absolute; top:16%;left:20%;width:33%;height:18%;
                         background:rgba(255,255,255,.7);border-radius:50%;transform:rotate(-35deg);filter:blur(2px); }
    .login-title { font-size:27px; font-weight:800; color:var(--sky-d); letter-spacing:3px; margin-bottom:8px; }
    .login-sub   { font-size:14px; color:var(--muted); margin-bottom:38px; line-height:1.75; }
    .btn-google  { display:flex; align-items:center; gap:10px; background:#fff;
                   border:1.5px solid var(--sky-ll); border-radius:50px; padding:13px 26px;
                   font-size:16px; font-weight:600; color:var(--sky-d); cursor:pointer;
                   box-shadow:0 2px 12px rgba(14,165,233,.15); transition:box-shadow .2s; margin:0 auto; }
    .btn-google:hover { box-shadow:0 4px 22px rgba(14,165,233,.3); }

    /* ── 앱 공통 ── */
    #pg-app { padding-bottom:68px; }
    .inner  { width:100%; max-width:420px; padding:0 18px; }
    .app-header { width:100%;max-width:420px;display:flex;align-items:center;
                  justify-content:space-between;padding:50px 18px 10px; }
    .logo      { font-size:18px; font-weight:800; color:var(--sky-d); letter-spacing:2px; }
    .user-row  { display:flex; align-items:center; gap:8px; }
    .user-name { font-size:12px; color:var(--muted); }
    .avatar    { width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid var(--sky-ll); }
    .btn-out   { background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;
                 padding:4px 8px;border-radius:12px; }

    .tab { display:none; flex-direction:column; align-items:center; width:100%; }
    .tab.active { display:flex; }

    /* ── 기 받기 탭 ── */
    .card { width:100%;background:var(--card);border:1px solid var(--cb);border-radius:22px;
            box-shadow:0 4px 22px rgba(14,165,233,.1);padding:20px 22px;
            display:flex;flex-direction:column;align-items:center;margin-bottom:34px; }
    .card-lbl { font-size:11px;color:var(--sky-l);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:4px; }
    .ki-num   { font-size:56px;font-weight:900;color:var(--sky);line-height:1;margin-bottom:14px;
                text-shadow:0 2px 18px rgba(14,165,233,.28); }
    .orb-row  { display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:18px; }
    .sorb     { width:17px;height:17px;border-radius:50%;position:relative;
                background:radial-gradient(circle at 34% 28%,#fff,#bae6fd 34%,#38bdf8 70%,var(--sky-d));
                box-shadow:0 0 7px rgba(14,165,233,.6);
                animation:sFloat 3s ease-in-out infinite;animation-delay:calc(var(--i)*.13s); }
    .sorb::before { content:'';position:absolute;top:18%;left:20%;width:36%;height:20%;
                    background:rgba(255,255,255,.7);border-radius:50%;transform:rotate(-30deg); }
    .orb-empty { font-size:13px;color:var(--sky-ll);font-style:italic; }
    .extra     { font-size:12px;color:var(--sky-l);align-self:center; }
    @keyframes sFloat { 0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);} }

    .orb-wrap { position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:38px; }
    .orb-glow { position:absolute;width:218px;height:218px;border-radius:50%;
                background:radial-gradient(circle,rgba(14,165,233,.18),transparent 70%);
                animation:glowB 3.5s ease-in-out infinite; }
    @keyframes glowB { 0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.17);opacity:1;} }

    .main-orb { width:162px;height:162px;border-radius:50%;position:relative;
                transition:background .45s,box-shadow .45s,opacity .4s,filter .4s;
                animation:float3d 4.2s ease-in-out infinite;
                opacity:.6;filter:saturate(.55);
                background:radial-gradient(circle at 35% 30%,#e0f2fe,#bae6fd 26%,#7dd3fc 52%,#38bdf8 74%,var(--sky-d));
                box-shadow:0 0 20px rgba(14,165,233,.22),inset 0 -12px 26px rgba(2,132,199,.16); }
    .main-orb.ready { opacity:1;filter:saturate(1);
                      background:radial-gradient(circle at 35% 30%,#fff 0%,#e0f2fe 11%,#bae6fd 27%,#7dd3fc 43%,#38bdf8 57%,var(--sky) 72%,var(--sky-d) 87%,var(--sky-dd) 100%);
                      box-shadow:0 0 50px rgba(14,165,233,.8),0 0 100px rgba(14,165,233,.3),inset 0 -12px 26px rgba(3,105,161,.2);
                      animation:float3d 4.2s ease-in-out infinite,orbP 1.7s ease-in-out infinite; }
    .main-orb::before { content:'';position:absolute;top:15%;left:19%;width:34%;height:18%;
                        background:rgba(255,255,255,.7);border-radius:50%;transform:rotate(-35deg);
                        filter:blur(2px);animation:shimmer 4s ease-in-out infinite; }
    .main-orb::after  { content:'';position:absolute;top:27%;left:25%;width:18%;height:9%;
                        background:rgba(255,255,255,.34);border-radius:50%;transform:rotate(-35deg);filter:blur(1px); }
    .orb-emoji { position:absolute;font-size:50px;top:50%;left:50%;
                 transform:translate(-50%,-48%);pointer-events:none;
                 filter:drop-shadow(0 0 8px rgba(255,255,255,.5)); }
    .ripple    { position:absolute;width:162px;height:162px;border-radius:50%;
                 border:2px solid rgba(14,165,233,.65);
                 animation:rippleOut .85s ease-out forwards;pointer-events:none; }

    @keyframes float3d  { 0%,100%{transform:translateY(0) rotateY(0deg);}30%{transform:translateY(-11px) rotateY(3deg);}70%{transform:translateY(-6px) rotateY(-2deg);} }
    @keyframes orbP     { 0%,100%{box-shadow:0 0 50px rgba(14,165,233,.8),0 0 100px rgba(14,165,233,.3),inset 0 -12px 26px rgba(3,105,161,.2);}50%{box-shadow:0 0 72px rgba(56,189,248,1),0 0 150px rgba(14,165,233,.55),inset 0 -12px 26px rgba(3,105,161,.2);} }
    @keyframes shimmer  { 0%,100%{opacity:.7;}50%{opacity:1;} }
    @keyframes rippleOut{ 0%{transform:scale(1);opacity:1;}100%{transform:scale(2.3);opacity:0;} }

    .btn-main { width:208px;padding:16px 28px;border-radius:50px;border:none;outline:none;
                font-size:18px;font-weight:700;letter-spacing:1px;cursor:pointer;
                transition:transform .15s,box-shadow .2s; }
    .btn-main.on  { background:linear-gradient(135deg,#38bdf8,var(--sky),var(--sky-d));color:#fff;
                    box-shadow:0 4px 20px rgba(14,165,233,.5),0 8px 38px rgba(3,105,161,.2); }
    .btn-main.on:active { transform:scale(.94); }
    .btn-main.off { background:#e0f2fe;color:#bae6fd;cursor:default;border:1px solid rgba(125,211,252,.38); }

    .timer-box { margin-top:22px;text-align:center; }
    .timer-lbl { font-size:12px;color:var(--muted);margin-bottom:4px; }
    .timer-val  { font-size:36px;font-weight:700;color:var(--sky);letter-spacing:3px;
                  font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(14,165,233,.26); }
    .ready-msg  { margin-top:18px;font-size:15px;color:var(--sky); }

    /* ── 자랑글 탭 ── */
    .tab-title { font-size:19px;font-weight:800;color:var(--sky-d);letter-spacing:1px;margin-bottom:16px;width:100%; }

    /* 글 카드 */
    .post-card { width:100%;background:var(--card);border:1px solid var(--cb);border-radius:18px;
                 box-shadow:0 3px 18px rgba(14,165,233,.09);padding:18px;margin-bottom:12px; }
    .post-top  { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .post-author { font-size:13px;font-weight:600;color:var(--sky-d); }
    .ki-badge  { display:inline-flex;align-items:center;gap:3px;
                 background:rgba(14,165,233,.1);border-radius:20px;padding:3px 10px;
                 font-size:12px;color:var(--sky-d);font-weight:600; }
    .ki-badge.empty { background:rgba(0,0,0,.05);color:#9ca3af; }
    .post-body { font-size:15px;color:var(--text);line-height:1.65;white-space:pre-wrap;
                 word-break:break-all;margin-bottom:14px; }
    .post-date { font-size:11px;color:var(--muted);margin-bottom:12px; }

    .btn-claim { width:100%;padding:13px;border-radius:40px;border:none;
                 font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s; }
    .btn-claim.on  { background:linear-gradient(135deg,#38bdf8,var(--sky),var(--sky-d));color:#fff;
                     box-shadow:0 3px 16px rgba(14,165,233,.42); }
    .btn-claim.on:active { transform:scale(.96); }
    .btn-claim.done { background:#e0f2fe;color:#bae6fd;cursor:default;border:1px solid rgba(125,211,252,.35); }
    .btn-claim.spent { background:#f1f5f9;color:#cbd5e1;cursor:default; }

    .no-post { text-align:center;padding:52px 0; }
    .no-post .e { font-size:44px;margin-bottom:10px; }
    .no-post p { font-size:14px;color:var(--muted);line-height:1.75; }
    .post-loading { text-align:center;padding:52px 0;color:var(--muted);font-size:14px; }

    /* ── 쓰기 탭 ── */
    .write-info { width:100%;background:rgba(14,165,233,.07);border:1px solid rgba(14,165,233,.18);
                  border-radius:14px;padding:14px 16px;margin-bottom:18px;
                  font-size:13px;color:var(--sky-d);line-height:1.7; }

    /* ki 피커 */
    .ki-picker  { width:100%;display:flex;align-items:center;justify-content:center;
                  gap:0;margin-bottom:6px; }
    .kp-btn     { width:44px;height:44px;border-radius:50%;border:1.5px solid var(--sky-ll);
                  background:#fff;font-size:22px;color:var(--sky);cursor:pointer;
                  display:flex;align-items:center;justify-content:center;
                  transition:background .15s;flex-shrink:0; }
    .kp-btn:active { background:var(--sky-ll); }
    .kp-mid     { flex:1;text-align:center; }
    .kp-num     { font-size:44px;font-weight:900;color:var(--sky);line-height:1; }
    .kp-unit    { font-size:14px;color:var(--muted);margin-top:2px; }
    .kp-hint    { text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px; }

    .write-textarea { width:100%;min-height:150px;border:1.5px solid var(--sky-ll);border-radius:16px;
                      padding:14px;font-size:15px;color:var(--text);resize:none;outline:none;
                      font-family:inherit;background:#fff;transition:border-color .2s;margin-bottom:6px; }
    .write-textarea:focus { border-color:var(--sky); }
    .write-textarea::placeholder { color:var(--sky-ll); }
    .char-count { text-align:right;font-size:12px;color:var(--muted);margin-bottom:16px; }

    .btn-submit { width:100%;padding:15px;border-radius:40px;border:none;font-size:17px;
                  font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s; }
    .btn-submit.on  { background:linear-gradient(135deg,#38bdf8,var(--sky),var(--sky-d));color:#fff;
                      box-shadow:0 4px 18px rgba(14,165,233,.42); }
    .btn-submit.on:active { transform:scale(.96); }
    .btn-submit.off { background:#e0f2fe;color:#bae6fd;cursor:default;border:1px solid rgba(125,211,252,.3); }

    /* ── 탭 바 ── */
    .tab-bar { position:fixed;bottom:0;left:0;right:0;height:62px;
               background:rgba(255,255,255,.96);border-top:1px solid var(--sky-ll);
               display:flex;z-index:10;backdrop-filter:blur(10px); }
    .tab-btn { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
               gap:2px;background:none;border:none;cursor:pointer;color:var(--muted);
               font-size:10px;font-weight:600;letter-spacing:.4px;transition:color .2s; }
    .tab-btn .ti { font-size:21px; }
    .tab-btn.active { color:var(--sky); }

    /* ── FX / 토스트 ── */
    #fx { position:fixed;inset:0;pointer-events:none;z-index:200;
          display:flex;align-items:center;justify-content:center; }
    .fx-e { font-size:52px;animation:floatUp 1.1s ease-out forwards; }
    @keyframes floatUp { 0%{transform:translateY(0) scale(.5);opacity:0;}28%{transform:translateY(-18px) scale(1.25);opacity:1;}100%{transform:translateY(-110px) scale(1);opacity:0;} }

    #toast { position:fixed;bottom:76px;left:50%;transform:translateX(-50%);
             background:rgba(12,74,110,.9);color:#fff;padding:11px 22px;border-radius:28px;
             font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;
             pointer-events:none;white-space:nowrap; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>

<div id="hands"></div>
<div id="fx" style="display:none"></div>
<div id="toast"></div>

<!-- ── 로딩 ── -->
<div id="pg-loading" class="page active">
  <div class="spin-orb"></div>
  <p>잠시만요...</p>
</div>

<!-- ── 로그인 ── -->
<div id="pg-login" class="page">
  <div class="login-orb"></div>
  <div class="login-title">기받아가요</div>
  <div class="login-sub">하루에 한 번 기운을 받고,<br>자랑글로 기를 나눠요</div>
  <button class="btn-google" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google로 시작하기
  </button>
</div>

<!-- ── 앱 ── -->
<div id="pg-app" class="page">
  <div class="app-header">
    <span class="logo">기받아가요</span>
    <div class="user-row">
      <span class="user-name" id="hdr-name"></span>
      <img class="avatar" id="hdr-avatar" src="" alt="" style="display:none">
      <button class="btn-out" onclick="signOut()">로그아웃</button>
    </div>
  </div>

  <div class="inner">

    <!-- 기 받기 탭 -->
    <div id="tab-home" class="tab active">
      <div class="card">
        <div class="card-lbl">보유한 기</div>
        <div class="ki-num" id="ki-num">0</div>
        <div class="orb-row" id="orb-row">
          <span class="orb-empty">아직 기가 없어요. 첫 기를 받아보세요!</span>
        </div>
      </div>

      <div class="orb-wrap">
        <div class="orb-glow"></div>
        <div class="main-orb" id="main-orb">
          <span class="orb-emoji" id="orb-emoji">💧</span>
        </div>
      </div>

      <button class="btn-main off" id="daily-btn" onclick="collectDailyKi()">💧 기 충전 중</button>
      <div class="timer-box" id="timer-box">
        <div class="timer-lbl">다음 기까지</div>
        <div class="timer-val" id="timer-val">00:00:00</div>
      </div>
      <div class="ready-msg" id="ready-msg" style="display:none">기운이 충전되었어요 ✨</div>
    </div>

    <!-- 자랑글 탭 -->
    <div id="tab-post" class="tab">
      <div class="tab-title">자랑글 📬</div>
      <div id="post-list"><div class="post-loading">불러오는 중...</div></div>
    </div>

    <!-- 쓰기 탭 -->
    <div id="tab-write" class="tab">
      <div class="tab-title">자랑글 쓰기 ✏️</div>

      <div class="write-info">
        글에 담을 기를 선택하세요.<br>
        그 수만큼 다른 회원에게 배달되고,<br>
        받는 사람은 하루에 1기씩 가져갈 수 있어요.
      </div>

      <!-- ki 피커 -->
      <div class="ki-picker">
        <button class="kp-btn" onclick="adjustKi(-1)">−</button>
        <div class="kp-mid">
          <div class="kp-num" id="kp-num">1</div>
          <div class="kp-unit">기</div>
        </div>
        <button class="kp-btn" onclick="adjustKi(+1)">+</button>
      </div>
      <div class="kp-hint" id="kp-hint">현재 보유: 0기</div>

      <textarea class="write-textarea" id="write-area" maxlength="300"
                placeholder="오늘 자랑하고 싶은 일을 적어보세요 😄"></textarea>
      <div class="char-count"><span id="char-cnt">0</span> / 300</div>

      <button class="btn-submit off" id="submit-btn" onclick="submitPost()">
        ✨ 자랑글 올리기
      </button>
    </div>

  </div><!-- /inner -->

  <div class="tab-bar">
    <button class="tab-btn active" id="tbtn-home" onclick="switchTab('home')">
      <span class="ti">🌟</span>기 받기
    </button>
    <button class="tab-btn" id="tbtn-post" onclick="switchTab('post')">
      <span class="ti">📬</span>자랑글
    </button>
    <button class="tab-btn" id="tbtn-write" onclick="switchTab('write')">
      <span class="ti">✏️</span>쓰기
    </button>
  </div>
</div>

<script>
/* ══════════════════════════════════
   Firebase 설정값 — 콘솔에서 복사
   https://console.firebase.google.com
   ══════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDXUtzrvsfTiR912OlRN7yvcK9lzKFhJKQ",
  authDomain: "ki-badagayo.firebaseapp.com",
  projectId: "ki-badagayo",

/* ══════════════════════════════════ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

/* ─── 상태 ─── */
let me      = null;   // Firebase user
let uData   = null;   // Firestore user doc
let canDay  = false;
let dayBusy = false;
let tickId  = null;
let kiPick  = 1;      // 글에 담을 기 수

/* ─── 유틸 ─── */
const today = () => new Date().toLocaleDateString('sv-SE');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showFx(e) {
  const el = document.getElementById('fx');
  el.style.display = 'flex';
  el.innerHTML = `<span class="fx-e">${e}</span>`;
  setTimeout(() => { el.style.display='none'; el.innerHTML=''; }, 1150);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ─── 🙏 배경 ─── */
(function() {
  const w = document.getElementById('hands');
  for (let i = 0; i < 13; i++) {
    const s = document.createElement('span');
    s.className = 'hand';
    s.textContent = '🙏';
    const sz = 18 + Math.random() * 26;
    s.style.cssText = `left:${Math.random()*96}%;--sz:${sz}px;--d:${10+Math.random()*15}s;--dl:-${Math.random()*13}s;`;
    w.appendChild(s);
  }
})();

/* ─── Auth ─── */
function signIn() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => toast('로그인 실패: ' + e.message));
}
function signOut() { auth.signOut(); }

auth.onAuthStateChanged(async user => {
  if (user) {
    await initUser(user);
    showApp();
  } else {
    me = null; uData = null;
    showPage('pg-login');
  }
});

/* ─── 유저 초기화 ─── */
async function initUser(user) {
  me = user;
  const ref  = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    uData = { displayName: user.displayName||'익명', photoURL: user.photoURL||'',
              kiBalance: 0, lastDailyKi: '' };
    await ref.set(uData);
  } else {
    uData = snap.data();
    const upd = {};
    if (uData.displayName !== user.displayName) upd.displayName = user.displayName;
    if (uData.photoURL    !== user.photoURL)    upd.photoURL    = user.photoURL;
    if (Object.keys(upd).length) { await ref.update(upd); Object.assign(uData, upd); }
  }
}

/* ─── 앱 진입 ─── */
function showApp() {
  document.getElementById('hdr-name').textContent = uData.displayName;
  const av = document.getElementById('hdr-avatar');
  if (uData.photoURL) { av.src = uData.photoURL; av.style.display = ''; }
  renderKi();
  startTick();
  switchTab('home');
  showPage('pg-app');
}

/* ─── Ki 렌더 ─── */
function renderKi() {
  const bal = uData.kiBalance;
  document.getElementById('ki-num').textContent = bal;
  document.getElementById('kp-hint').textContent = `현재 보유: ${bal}기`;

  // 작은 오브
  const row = document.getElementById('orb-row');
  row.innerHTML = '';
  if (bal === 0) {
    row.innerHTML = '<span class="orb-empty">아직 기가 없어요. 첫 기를 받아보세요!</span>';
  } else {
    const show = Math.min(bal, 15);
    for (let i = 0; i < show; i++) {
      const d = document.createElement('div'); d.className='sorb'; d.style.setProperty('--i',i);
      row.appendChild(d);
    }
    if (bal > 15) { const e=document.createElement('span'); e.className='extra'; e.textContent=`+${bal-15}`; row.appendChild(e); }
  }

  // ki 피커 범위 조정
  if (kiPick > bal) kiPick = Math.max(1, bal);
  document.getElementById('kp-num').textContent = kiPick;
  updateSubmitBtn();
}

/* ─── 일일 기 타이머 ─── */
function startTick() {
  if (tickId) clearInterval(tickId);
  tick(); tickId = setInterval(tick, 1000);
}

function tick() {
  if (uData.lastDailyKi !== today()) { setCanDay(true); return; }
  setCanDay(false);
  const mid = new Date(); mid.setHours(24,0,0,0);
  const rem = mid - Date.now();
  const h=Math.floor(rem/3600000), m=Math.floor((rem%3600000)/60000), s=Math.floor((rem%60000)/1000);
  document.getElementById('timer-val').textContent =
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setCanDay(v) {
  canDay = v;
  document.getElementById('main-orb').className  = 'main-orb' + (v?' ready':'');
  document.getElementById('orb-emoji').textContent = v ? '✨' : '💧';
  document.getElementById('daily-btn').className  = 'btn-main ' + (v?'on':'off');
  document.getElementById('daily-btn').innerHTML  = v ? '✨ 기 받기' : '💧 기 충전 중';
  document.getElementById('timer-box').style.display  = v ? 'none' : 'block';
  document.getElementById('ready-msg').style.display  = v ? 'block' : 'none';
}

/* ─── 일일 기 받기 ─── */
async function collectDailyKi() {
  if (!canDay || dayBusy) return;
  dayBusy = true;
  if (navigator.vibrate) navigator.vibrate([25,15,55]);

  const wrap = document.querySelector('.orb-wrap');
  const r = document.createElement('div'); r.className='ripple';
  wrap.appendChild(r); setTimeout(()=>r.remove(), 900);
  showFx('✨');

  try {
    const newBal = uData.kiBalance + 1;
    await db.collection('users').doc(me.uid).update({ kiBalance: newBal, lastDailyKi: today() });
    uData.kiBalance = newBal; uData.lastDailyKi = today();
    renderKi(); setCanDay(false); toast('기를 받았어요! +1기');
  } catch(e) { toast('오류: ' + e.message); }
  finally { dayBusy = false; }
}

/* ─── 탭 전환 ─── */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`tbtn-${name}`).classList.add('active');
  if (name === 'post')  loadPosts();
  if (name === 'write') { updateKiPickDisplay(); updateSubmitBtn(); }
}

/* ─── 자랑글 목록 로드 ─── */
async function loadPosts() {
  const area = document.getElementById('post-list');
  area.innerHTML = '<div class="post-loading">불러오는 중...</div>';

  try {
    // kiRemaining > 0 인 글 전체 (내가 쓴 글 포함, 클라이언트에서 필터)
    const snap = await db.collection('posts')
      .where('kiRemaining', '>', 0)
      .orderBy('kiRemaining')   // Firestore: inequality field must be first sort
      .orderBy('createdAt', 'desc')
      .get();

    const posts = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.authorId !== me.uid);  // 내 글 제외

    if (posts.length === 0) {
      area.innerHTML = `<div class="no-post"><div class="e">🙏</div><p>아직 받을 자랑글이 없어요.<br>자랑글 탭에서 첫 번째로 올려보세요!</p></div>`;
      return;
    }

    // 오늘 이미 받은 글 목록 조회
    const claimChecks = posts.map(p =>
      db.collection('posts').doc(p.id)
        .collection('dailyClaims').doc(`${today()}_${me.uid}`).get()
    );
    const claimSnaps = await Promise.all(claimChecks);
    const claimedToday = new Set(
      claimSnaps.filter(s => s.exists).map(s => s.ref.parent.parent.id)
    );

    area.innerHTML = '';
    posts.forEach((p, i) => {
      const claimed = claimedToday.has(p.id);
      const dateStr = p.date || '';
      area.innerHTML += `
        <div class="post-card">
          <div class="post-top">
            <span class="post-author">🌟 ${esc(p.authorName)}</span>
            <span class="ki-badge${p.kiRemaining===0?' empty':''}">
              🔮 ${p.kiRemaining}기 남음
            </span>
          </div>
          <div class="post-body">${esc(p.content)}</div>
          <div class="post-date">${dateStr}</div>
          <button id="claim-${p.id}"
            class="btn-claim ${claimed?'done':p.kiRemaining>0?'on':'spent'}"
            onclick="claimKi('${p.id}')"
            ${claimed||p.kiRemaining===0?'disabled':''}>
            ${claimed ? '✅ 오늘 기를 받았어요' : p.kiRemaining > 0 ? '🙏 이 글에서 기 받기 (+1기)' : '기 소진'}
          </button>
        </div>`;
    });
  } catch(e) {
    area.innerHTML = `<div class="post-loading">오류: ${esc(e.message)}</div>`;
  }
}

/* ─── 자랑글에서 기 받기 (Firestore 트랜잭션) ─── */
async function claimKi(postId) {
  const btn = document.getElementById(`claim-${postId}`);
  if (!btn || btn.disabled) return;
  btn.disabled = true; btn.textContent = '받는 중...';

  const postRef  = db.collection('posts').doc(postId);
  const claimRef = postRef.collection('dailyClaims').doc(`${today()}_${me.uid}`);
  const userRef  = db.collection('users').doc(me.uid);

  try {
    await db.runTransaction(async t => {
      const [postSnap, claimSnap, userSnap] = await Promise.all([
        t.get(postRef), t.get(claimRef), t.get(userRef)
      ]);

      if (!postSnap.exists)      throw new Error('글이 없습니다');
      if (claimSnap.exists)      throw new Error('오늘은 이미 받았어요');
      if (postSnap.data().kiRemaining <= 0) throw new Error('기가 모두 소진되었습니다');
      if (postSnap.data().authorId === me.uid) throw new Error('내 글에서는 받을 수 없어요');

      t.update(postRef, { kiRemaining: postSnap.data().kiRemaining - 1 });
      t.set(claimRef, { uid: me.uid, postId, date: today(),
                        claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
      t.update(userRef, { kiBalance: userSnap.data().kiBalance + 1 });
    });

    uData.kiBalance += 1;
    renderKi();
    showFx('🙏');
    toast('자랑글에서 기를 받았어요! +1기');

    btn.className = 'btn-claim done';
    btn.disabled  = true;
    btn.textContent = '✅ 오늘 기를 받았어요';

    // 남은 기 배지 갱신
    const postSnap = await postRef.get();
    const badge = btn.closest('.post-card')?.querySelector('.ki-badge');
    if (badge) badge.textContent = `🔮 ${postSnap.data().kiRemaining}기 남음`;

  } catch(e) {
    toast(e.message);
    btn.disabled = false;
    btn.textContent = '🙏 이 글에서 기 받기 (+1기)';
  }
}

/* ─── ki 피커 ─── */
function adjustKi(delta) {
  const max = uData?.kiBalance || 0;
  kiPick = Math.min(Math.max(1, kiPick + delta), Math.max(1, max));
  updateKiPickDisplay();
  updateSubmitBtn();
}
function updateKiPickDisplay() {
  document.getElementById('kp-num').textContent  = kiPick;
  document.getElementById('kp-hint').textContent = `현재 보유: ${uData?.kiBalance||0}기 · ${kiPick}기 소모`;
}

/* ─── 쓰기 ─── */
const writeArea = document.getElementById('write-area');
writeArea.addEventListener('input', () => {
  document.getElementById('char-cnt').textContent = writeArea.value.length;
  updateSubmitBtn();
});

function updateSubmitBtn() {
  const btn = document.getElementById('submit-btn');
  const ok  = uData && uData.kiBalance >= kiPick && kiPick >= 1 && writeArea.value.trim().length > 0;
  btn.className  = `btn-submit ${ok?'on':'off'}`;
  btn.textContent = ok ? `✨ 자랑글 올리기 (${kiPick}기 소모)` : '✨ 자랑글 올리기';
}

async function submitPost() {
  const content = writeArea.value.trim();
  if (!content || !uData || uData.kiBalance < kiPick || kiPick < 1) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '올리는 중...';

  try {
    const newBal = uData.kiBalance - kiPick;
    const batch  = db.batch();
    batch.update(db.collection('users').doc(me.uid), { kiBalance: newBal });
    batch.set(db.collection('posts').doc(), {
      authorId:    me.uid,
      authorName:  uData.displayName,
      content,
      date:        today(),
      kiPool:      kiPick,
      kiRemaining: kiPick,
      createdAt:   firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();

    uData.kiBalance = newBal;
    kiPick = 1;
    writeArea.value = '';
    document.getElementById('char-cnt').textContent = '0';
    renderKi(); updateKiPickDisplay();
    showFx('📮');
    toast(`자랑글을 올렸어요! -${kiPick + (newBal - (uData.kiBalance))}기`);
    switchTab('home');
  } catch(e) { toast('오류: ' + e.message); }
  finally { btn.disabled = false; updateSubmitBtn(); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
