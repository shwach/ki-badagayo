  <meta name="twitter:description" content="하루에 한 번, 자랑글을 올리고 기운을 나눠요. 누군가의 기운이 당신에게 배달됩니다.">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --sky:   #38bdf8;
      --sky-d: #0284c7;
      --sky-ll:#e0f2fe;
      --pur:   #a78bfa;
      --pur-d: #7c3aed;
      --pur-dd:#5b21b6;
      --pur-ll:#ede9fe;
      --bg:    #f8f6ff;
      --text:  #1e1b4b;
      --muted: #818cf8;
      --card:  rgba(255,255,255,.92);
      --cb:    rgba(139,92,246,.22);
      /* 공용 그라디언트 방향 */
      --grad:  135deg,#38bdf8,#818cf8,#a78bfa,#8b5cf6;
    }

    html, body { height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif; color:var(--text); overflow:hidden; }

    /* ── 🙏 배경 ── */
    #hands { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .hand  { position:absolute; bottom:-60px; font-size:var(--sz); opacity:0;
             animation:riseHand var(--d) ease-in-out infinite var(--dl); user-select:none; }
    @keyframes riseHand {
      0%   { transform:translateY(0)      rotate(0deg);  opacity:0;   }
      12%  { opacity:.11; }
      50%  { transform:translateY(-52vh)  rotate(5deg);  }
      88%  { opacity:.06; }
      100% { transform:translateY(-115vh) rotate(-4deg); opacity:0;   }
    }

    /* ── 페이지 공통 ── */
    .page { display:none; position:fixed; inset:0; overflow-y:auto;
            background:
              radial-gradient(ellipse at 10% 0%,   rgba(56,189,248,.3)  0%, transparent 52%),
              radial-gradient(ellipse at 90% 100%,  rgba(167,139,250,.28) 0%, transparent 52%),
              linear-gradient(160deg, #f0f9ff 0%, #fdf4ff 60%, #ede9fe 100%);
            z-index:1; }
    .page.active { display:flex; flex-direction:column; align-items:center; }

    /* ── 로딩 ── */
    #pg-loading { justify-content:center; }
    .spin-orb { width:76px; height:76px; border-radius:50%;
                background:radial-gradient(circle at 35% 30%,#fff,#bae6fd 20%,#818cf8 55%,var(--pur-d));
                box-shadow:0 0 38px rgba(139,92,246,.5); animation:pulse 1.7s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
    #pg-loading p { margin-top:14px; color:var(--muted); font-size:14px; }

    /* ── 앱 공통 ── */
    #pg-app { padding-bottom:68px; }
    .inner  { width:100%; max-width:420px; padding:0 18px; }
    .app-header { width:100%;max-width:420px;display:flex;align-items:center;
                  justify-content:space-between;padding:50px 18px 10px; }
    .logo      { font-size:18px; font-weight:800; color:var(--pur-d); letter-spacing:2px; }
    .tab { display:none; flex-direction:column; align-items:center; width:100%; }
    .tab.active { display:flex; }

    /* ── 기 받기 탭 ── */
    .card { width:100%;background:var(--card);border:1px solid var(--cb);border-radius:22px;
            box-shadow:0 4px 22px rgba(139,92,246,.1);padding:20px 22px;
            display:flex;flex-direction:column;align-items:center;margin-bottom:34px; }
    .card-lbl { font-size:11px;color:var(--pur);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:4px; }
    .ki-num   { font-size:56px;font-weight:900;line-height:1;margin-bottom:14px;
                background:linear-gradient(135deg,#38bdf8,#818cf8,#a78bfa);
                -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .orb-row  { display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:18px; }
    .sorb     { width:17px;height:17px;border-radius:50%;position:relative;
                background:radial-gradient(circle at 34% 28%,#fff,#bae6fd 22%,#818cf8 58%,var(--pur-d));
                box-shadow:0 0 7px rgba(139,92,246,.6);
                animation:sFloat 3s ease-in-out infinite;animation-delay:calc(var(--i)*.13s); }
    .sorb::before { content:'';position:absolute;top:18%;left:20%;width:36%;height:20%;
                    background:rgba(255,255,255,.7);border-radius:50%;transform:rotate(-30deg); }
    .orb-empty { font-size:13px;color:#c4b5fd;font-style:italic; }
    .extra     { font-size:12px;color:var(--pur);align-self:center; }
    @keyframes sFloat { 0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);} }

    .orb-wrap { position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:38px; }
    .orb-glow { position:absolute;width:218px;height:218px;border-radius:50%;
                background:radial-gradient(circle,rgba(56,189,248,.15),rgba(167,139,250,.12),transparent 70%);
                animation:glowB 3.5s ease-in-out infinite; }
    @keyframes glowB { 0%,100%{transform:scale(1);opacity:.75;}50%{transform:scale(1.17);opacity:1;} }

    /* 충전 중 (어두운 상태) */
    .main-orb { width:162px;height:162px;border-radius:50%;position:relative;
                transition:background .45s,box-shadow .45s,opacity .4s,filter .4s;
                animation:float3d 4.2s ease-in-out infinite;
                opacity:.6;filter:saturate(.5);
                background:radial-gradient(circle at 35% 30%,#e0f2fe,#bae6fd 20%,#818cf8 50%,#7c3aed 76%,#5b21b6 100%);
                box-shadow:0 0 20px rgba(139,92,246,.25),inset 0 -12px 26px rgba(91,33,182,.18); }
    /* 충전 완료 (밝은 상태) */
    .main-orb.ready { opacity:1;filter:saturate(1);
                      background:radial-gradient(circle at 35% 30%,#fff 0%,#e0f2fe 10%,#bae6fd 22%,#7dd3fc 34%,#38bdf8 46%,#818cf8 60%,#a78bfa 74%,#8b5cf6 87%,#6d28d9 100%);
                      box-shadow:0 0 50px rgba(56,189,248,.7),0 0 90px rgba(139,92,246,.4),inset 0 -12px 26px rgba(91,33,182,.2);
                      animation:float3d 4.2s ease-in-out infinite,orbP 1.7s ease-in-out infinite; }
    .main-orb::before { content:'';position:absolute;top:15%;left:19%;width:34%;height:18%;
                        background:rgba(255,255,255,.72);border-radius:50%;transform:rotate(-35deg);
                        filter:blur(2px);animation:shimmer 4s ease-in-out infinite; }
    .main-orb::after  { content:'';position:absolute;top:27%;left:25%;width:18%;height:9%;
                        background:rgba(255,255,255,.36);border-radius:50%;transform:rotate(-35deg);filter:blur(1px); }
    .orb-emoji { position:absolute;font-size:50px;top:50%;left:50%;
                 transform:translate(-50%,-48%);pointer-events:none;
                 filter:drop-shadow(0 0 8px rgba(255,255,255,.5)); }
    .ripple    { position:absolute;width:162px;height:162px;border-radius:50%;
                 border:2px solid rgba(139,92,246,.6);
                 animation:rippleOut .85s ease-out forwards;pointer-events:none; }

    @keyframes float3d  { 0%,100%{transform:translateY(0) rotateY(0deg);}30%{transform:translateY(-11px) rotateY(3deg);}70%{transform:translateY(-6px) rotateY(-2deg);} }
    @keyframes orbP     { 0%,100%{box-shadow:0 0 50px rgba(56,189,248,.7),0 0 90px rgba(139,92,246,.4),inset 0 -12px 26px rgba(91,33,182,.2);}50%{box-shadow:0 0 72px rgba(167,139,250,1),0 0 140px rgba(56,189,248,.5),inset 0 -12px 26px rgba(91,33,182,.2);} }
    @keyframes shimmer  { 0%,100%{opacity:.72;}50%{opacity:1;} }
    @keyframes rippleOut{ 0%{transform:scale(1);opacity:1;}100%{transform:scale(2.3);opacity:0;} }

    .btn-main { width:208px;padding:16px 28px;border-radius:50px;border:none;outline:none;
                font-size:18px;font-weight:700;letter-spacing:1px;cursor:pointer;
                transition:transform .15s,box-shadow .2s; }
    .btn-main.on  { background:linear-gradient(var(--grad));color:#fff;
                    box-shadow:0 4px 20px rgba(139,92,246,.45),0 8px 38px rgba(56,189,248,.2); }
    .btn-main.on:active { transform:scale(.94); }
    .btn-main.off { background:var(--pur-ll);color:#c4b5fd;cursor:default;border:1px solid rgba(167,139,250,.35); }

    .timer-box { margin-top:22px;text-align:center; }
    .timer-lbl { font-size:12px;color:var(--muted);margin-bottom:4px; }
    .timer-val  { font-size:36px;font-weight:700;letter-spacing:3px;font-variant-numeric:tabular-nums;
                  background:linear-gradient(135deg,#38bdf8,#a78bfa);
                  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .ready-msg  { margin-top:18px;font-size:15px;color:var(--pur); }

    /* ── 자랑글 탭 ── */
    .tab-title { font-size:19px;font-weight:800;color:var(--pur-d);letter-spacing:1px;margin-bottom:16px;width:100%; }

    /* 글 카드 */
    .post-card { width:100%;background:var(--card);border:1px solid var(--cb);border-radius:18px;
                 box-shadow:0 3px 18px rgba(139,92,246,.09);padding:18px;margin-bottom:12px; }
    .post-top  { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .post-author { font-size:13px;font-weight:600;color:var(--pur-d); }
    .ki-badge  { display:inline-flex;align-items:center;gap:3px;
                 background:rgba(139,92,246,.1);border-radius:20px;padding:3px 10px;
                 font-size:12px;color:var(--pur-d);font-weight:600; }
    .ki-badge.empty { background:rgba(0,0,0,.05);color:#9ca3af; }
    .post-body { font-size:15px;color:var(--text);line-height:1.65;white-space:pre-wrap;
                 word-break:break-all;margin-bottom:14px; }
    .post-date { font-size:11px;color:var(--muted);margin-bottom:12px; }

    .btn-claim { width:100%;padding:13px;border-radius:40px;border:none;
                 font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s; }
    .btn-claim.on  { background:linear-gradient(var(--grad));color:#fff;
                     box-shadow:0 3px 16px rgba(139,92,246,.4); }
    .btn-claim.on:active { transform:scale(.96); }
    .btn-claim.done  { background:var(--pur-ll);color:#c4b5fd;cursor:default;border:1px solid rgba(167,139,250,.3); }
    .btn-claim.spent { background:#f1f5f9;color:#cbd5e1;cursor:default; }

    .no-post { text-align:center;padding:52px 0; }
    .no-post .e { font-size:44px;margin-bottom:10px; }
    .no-post p { font-size:14px;color:var(--muted);line-height:1.75; }
    .post-loading { text-align:center;padding:52px 0;color:var(--muted);font-size:14px; }

    /* ── 쓰기 탭 ── */
    .write-info { width:100%;background:rgba(139,92,246,.07);border:1px solid rgba(139,92,246,.18);
                  border-radius:14px;padding:14px 16px;margin-bottom:18px;
                  font-size:13px;color:var(--pur-d);line-height:1.7; }

    /* ki 피커 */
    .ki-picker  { width:100%;display:flex;align-items:center;justify-content:center;
                  gap:0;margin-bottom:6px; }
    .kp-btn     { width:44px;height:44px;border-radius:50%;border:1.5px solid var(--pur-ll);
                  background:#fff;font-size:22px;color:var(--pur);cursor:pointer;
                  display:flex;align-items:center;justify-content:center;
                  transition:background .15s;flex-shrink:0; }
    .kp-btn:active { background:var(--pur-ll); }
    .kp-mid     { flex:1;text-align:center; }
    .kp-num     { font-size:44px;font-weight:900;line-height:1;
                  background:linear-gradient(135deg,#38bdf8,#a78bfa);
                  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .kp-unit    { font-size:14px;color:var(--muted);margin-top:2px; }
    .kp-hint    { text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px; }

    .write-textarea { width:100%;min-height:150px;border:1.5px solid var(--pur-ll);border-radius:16px;
                      padding:14px;font-size:15px;color:var(--text);resize:none;outline:none;
                      font-family:inherit;background:#fff;transition:border-color .2s;margin-bottom:6px; }
    .write-textarea:focus { border-color:var(--pur); }
    .write-textarea::placeholder { color:#c4b5fd; }
    .char-count { text-align:right;font-size:12px;color:var(--muted);margin-bottom:16px; }

    .btn-submit { width:100%;padding:15px;border-radius:40px;border:none;font-size:17px;
                  font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s; }
    .btn-submit.on  { background:linear-gradient(var(--grad));color:#fff;
                      box-shadow:0 4px 18px rgba(139,92,246,.42); }
    .btn-submit.on:active { transform:scale(.96); }
    .btn-submit.off { background:var(--pur-ll);color:#c4b5fd;cursor:default;border:1px solid rgba(167,139,250,.3); }

    /* ── 탭 바 ── */
    .tab-bar { position:fixed;bottom:0;left:0;right:0;height:62px;
               background:rgba(255,255,255,.96);
               border-top:1px solid rgba(167,139,250,.3);
               display:flex;z-index:10;backdrop-filter:blur(10px); }
    .tab-btn { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
               gap:2px;background:none;border:none;cursor:pointer;color:#c4b5fd;
               font-size:10px;font-weight:600;letter-spacing:.4px;transition:color .2s; }
    .tab-btn .ti { font-size:21px; }
    .tab-btn.active { color:var(--pur-d); }

    /* ── FX / 토스트 ── */
    #fx { position:fixed;inset:0;pointer-events:none;z-index:200;
          display:flex;align-items:center;justify-content:center; }
    .fx-e { font-size:52px;animation:floatUp 1.1s ease-out forwards; }
    @keyframes floatUp { 0%{transform:translateY(0) scale(.5);opacity:0;}28%{transform:translateY(-18px) scale(1.25);opacity:1;}100%{transform:translateY(-110px) scale(1);opacity:0;} }

    #toast { position:fixed;bottom:76px;left:50%;transform:translateX(-50%);
             background:rgba(91,33,182,.92);color:#fff;padding:11px 22px;border-radius:28px;
             font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;
             pointer-events:none;white-space:nowrap; }
    #toast.show { opacity:1; }

    /* ── 홈탭 자랑글 피드 ── */
    .feed-title { width:100%; font-size:13px; font-weight:700; color:var(--pur-d);
                  letter-spacing:.5px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .feed-wrap  { width:100%; margin-bottom:24px; }
    .feed-card  { width:100%; background:var(--card); border:1px solid var(--cb); border-radius:16px;
                  box-shadow:0 3px 14px rgba(139,92,246,.08); padding:14px 16px; margin-bottom:10px; }
    .feed-top   { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .feed-author{ font-size:12px; font-weight:700; color:var(--sky-d); }
    .feed-badge { font-size:11px; color:var(--sky-d); background:rgba(14,165,233,.1);
                  border-radius:16px; padding:2px 8px; font-weight:600; }
    .feed-body  { font-size:14px; color:var(--text); line-height:1.6; margin-bottom:10px;
                  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .btn-feed-claim { width:100%; padding:10px; border-radius:30px; border:none; font-size:14px;
                      font-weight:700; cursor:pointer; transition:transform .15s; }
    .btn-feed-claim.on   { background:linear-gradient(135deg,#38bdf8,var(--sky),var(--sky-d)); color:#fff; }
    .btn-feed-claim.on:active { transform:scale(.96); }
    .btn-feed-claim.done { background:#e0f2fe; color:#bae6fd; cursor:default; }
    .btn-feed-claim.spent{ background:#f1f5f9; color:#cbd5e1; cursor:default; }
    .feed-empty { text-align:center; padding:18px 0; font-size:13px; color:var(--muted); }

    /* ── 자랑글 탭 랭킹 ── */
    .rank-header { width:100%; font-size:19px; font-weight:800; color:var(--pur-d);
                   letter-spacing:1px; margin-bottom:16px; }
    .rank-card   { width:100%; background:var(--card); border:1px solid var(--cb);
                   border-radius:18px; box-shadow:0 3px 18px rgba(139,92,246,.09);
                   padding:16px 18px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
    .rank-num    { font-size:22px; min-width:32px; text-align:center; line-height:1.4; flex-shrink:0; }
    .rank-body   { flex:1; min-width:0; }
    .rank-text   { font-size:14px; color:var(--text); line-height:1.65; white-space:pre-wrap;
                   word-break:break-all; margin-bottom:8px;
                   display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .rank-stat   { font-size:12px; color:var(--muted); display:flex; gap:10px; }
    .rank-stat .ki-got  { color:var(--pur-d); font-weight:700; }
    .rank-empty  { text-align:center; padding:52px 0; font-size:14px; color:var(--muted); line-height:1.75; }
  </style>
</head>
<body>

<div id="hands"></div>
<div id="fx" style="display:none"></div>
<div id="toast"></div>

<!-- ── 로딩 ── -->
<div id="pg-loading" class="page active">
  <div class="spin-orb"></div>
  <p>잠시만요...</p>
</div>

<!-- ── 앱 ── -->
<div id="pg-app" class="page">
  <div class="app-header">
    <span class="logo">기받아가요</span>
  </div>

  <div class="inner">

    <!-- 기 받기 탭 -->
    <div id="tab-home" class="tab active">

      <!-- 자랑글 피드 -->
      <div class="feed-wrap" id="feed-wrap" style="display:none">
        <div class="feed-title">📬 기 배달</div>
        <div id="post-feed"></div>
      </div>

      <div class="card">
        <div class="card-lbl">보유한 기</div>
        <div class="ki-num" id="ki-num">0</div>
        <div class="orb-row" id="orb-row">
          <span class="orb-empty">아직 기가 없어요. 첫 기를 받아보세요!</span>
        </div>
      </div>

      <div class="orb-wrap">
        <div class="orb-glow"></div>
        <div class="main-orb" id="main-orb">
          <span class="orb-emoji" id="orb-emoji">🙏</span>
        </div>
      </div>

      <button class="btn-main off" id="daily-btn" onclick="collectDailyKi()">🙏 기 충전 중</button>
      <div class="timer-box" id="timer-box">
        <div class="timer-lbl">다음 기까지</div>
        <div class="timer-val" id="timer-val">00:00:00</div>
      </div>
      <div class="ready-msg" id="ready-msg" style="display:none">기운이 충전되었어요 ✨</div>
    </div>

    <!-- 자랑글 탭 -->
    <div id="tab-post" class="tab">
      <div class="rank-header">🏆 기 많이 받은 자랑글</div>
      <div id="top-posts"><div class="post-loading">불러오는 중...</div></div>
    </div>

    <!-- 쓰기 탭 -->
    <div id="tab-write" class="tab">
      <div class="tab-title">자랑글 쓰기 ✏️</div>

      <div class="write-info">
        글에 담을 기의 개수를 선택하세요.<br>
        그 수만큼 다른 회원에게 배달되고, 받는 사람은 필요하다면 그 글에서 1기씩 가져갈 수 있어요.<br>
        담긴 기를 모두 소진하면 자랑글은 더 이상 노출되지 않습니다.
      </div>

      <!-- ki 피커 -->
      <div class="ki-picker">
        <button class="kp-btn" onclick="adjustKi(-1)">−</button>
        <div class="kp-mid">
          <div class="kp-num" id="kp-num">1</div>
          <div class="kp-unit">기</div>
        </div>
        <button class="kp-btn" onclick="adjustKi(+1)">+</button>
      </div>
      <div class="kp-hint" id="kp-hint">현재 보유: 0기</div>

      <textarea class="write-textarea" id="write-area" maxlength="300"
                placeholder="오늘 자랑하고 싶은 일을 적어보세요 😄"></textarea>
      <div class="char-count"><span id="char-cnt">0</span> / 300</div>

      <button class="btn-submit off" id="submit-btn" onclick="submitPost()">
        ✨ 자랑글 올리기
      </button>
    </div>

  </div><!-- /inner -->

  <div class="tab-bar">
    <button class="tab-btn active" id="tbtn-home" onclick="switchTab('home')">
      <span class="ti">🌟</span>기 받기
    </button>
    <button class="tab-btn" id="tbtn-post" onclick="switchTab('post')">
      <span class="ti">📬</span>자랑글
    </button>
    <button class="tab-btn" id="tbtn-write" onclick="switchTab('write')">
      <span class="ti">✏️</span>쓰기
    </button>
  </div>
</div>

<script>
/* ══════════════════════════════════
   Firebase 설정값 — 콘솔에서 복사
   https://console.firebase.google.com
   ══════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDXUtzrvsfTiR912OlRN7yvcK9lzKFhJKQ",
  authDomain: "ki-badagayo.firebaseapp.com",
  projectId: "ki-badagayo",
  storageBucket: "ki-badagayo.firebasestorage.app",
  messagingSenderId: "625726911035",
  appId: "1:625726911035:web:6e2ef8818b901ad613621e",
  measurementId: "G-5NS8TDXDTT"
};
/* ══════════════════════════════════ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

/* ─── 상태 ─── */
let me      = null;   // Firebase user
let uData   = null;   // Firestore user doc
let canDay  = false;
let dayBusy = false;
let tickId  = null;
let kiPick  = 1;      // 글에 담을 기 수

/* ─── 유틸 ─── */
const today = () => new Date().toLocaleDateString('sv-SE');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showFx(e) {
  const el = document.getElementById('fx');
  el.style.display = 'flex';
  el.innerHTML = `<span class="fx-e">${e}</span>`;
  setTimeout(() => { el.style.display='none'; el.innerHTML=''; }, 1150);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ─── 🙏 배경 ─── */
(function() {
  const w = document.getElementById('hands');
  for (let i = 0; i < 13; i++) {
    const s = document.createElement('span');
    s.className = 'hand';
    s.textContent = '🙏';
    const sz = 18 + Math.random() * 26;
    s.style.cssText = `left:${Math.random()*96}%;--sz:${sz}px;--d:${10+Math.random()*15}s;--dl:-${Math.random()*13}s;`;
    w.appendChild(s);
  }
})();

/* ─── 랜덤 닉네임 ─── */
function randomNick() {
  const adj  = ['기운찬','밝은','따뜻한','활기찬','반짝이는','싱그러운','맑은','용감한','든든한','상쾌한'];
  const noun = ['구름','햇살','별빛','바람','이슬','새벽','노을','봄날','파도','숲속'];
  return adj[Math.floor(Math.random()*adj.length)] + noun[Math.floor(Math.random()*noun.length)];
}

/* ─── Auth: 익명 자동 로그인 ─── */
auth.onAuthStateChanged(async user => {
  if (user) {
    await initUser(user);
    showApp();
  } else {
    auth.signInAnonymously().catch(e => toast('오류: ' + e.message));
  }
});

/* ─── 유저 초기화 ─── */
async function initUser(user) {
  me = user;
  const ref  = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    const nick = user.displayName || randomNick();
    uData = { displayName: nick, photoURL: user.photoURL||'',
              kiBalance: 0, lastDailyKi: '' };
    await ref.set(uData);
  } else {
    uData = snap.data();
  }
}

/* ─── 앱 진입 ─── */
function showApp() {
  renderKi();
  startTick();
  loadFeed();
  switchTab('home');
  showPage('pg-app');
}

/* ─── Ki 렌더 ─── */
function renderKi() {
  const bal = uData.kiBalance;
  document.getElementById('ki-num').textContent = bal;
  document.getElementById('kp-hint').textContent = `현재 보유: ${bal}기`;

  // 작은 오브
  const row = document.getElementById('orb-row');
  row.innerHTML = '';
  if (bal === 0) {
    row.innerHTML = '<span class="orb-empty">아직 기가 없어요. 첫 기를 받아보세요!</span>';
  } else {
    const show = Math.min(bal, 15);
    for (let i = 0; i < show; i++) {
      const d = document.createElement('div'); d.className='sorb'; d.style.setProperty('--i',i);
      row.appendChild(d);
    }
    if (bal > 15) { const e=document.createElement('span'); e.className='extra'; e.textContent=`+${bal-15}`; row.appendChild(e); }
  }

  // ki 피커 범위 조정
  if (kiPick > bal) kiPick = Math.max(1, bal);
  document.getElementById('kp-num').textContent = kiPick;
  updateSubmitBtn();
}

/* ─── 일일 기 타이머 ─── */
function startTick() {
  if (tickId) clearInterval(tickId);
  tick(); tickId = setInterval(tick, 1000);
}

function tick() {
  if (uData.lastDailyKi !== today()) { setCanDay(true); return; }
  setCanDay(false);
  const mid = new Date(); mid.setHours(24,0,0,0);
  const rem = mid - Date.now();
  const h=Math.floor(rem/3600000), m=Math.floor((rem%3600000)/60000), s=Math.floor((rem%60000)/1000);
  document.getElementById('timer-val').textContent =
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setCanDay(v) {
  canDay = v;
  document.getElementById('main-orb').className  = 'main-orb' + (v?' ready':'');
  document.getElementById('orb-emoji').textContent = v ? '' : '💧';
  document.getElementById('daily-btn').className  = 'btn-main ' + (v?'on':'off');
  document.getElementById('daily-btn').innerHTML  = v ? '기 받기' : '💧 기 충전 중';
  document.getElementById('timer-box').style.display  = v ? 'none' : 'block';
  document.getElementById('ready-msg').style.display  = v ? 'block' : 'none';
}

/* ─── 일일 기 받기 ─── */
async function collectDailyKi() {
  if (!canDay || dayBusy) return;
  dayBusy = true;
  if (navigator.vibrate) navigator.vibrate([25,15,55]);

  const wrap = document.querySelector('.orb-wrap');
  const r = document.createElement('div'); r.className='ripple';
  wrap.appendChild(r); setTimeout(()=>r.remove(), 900);
  showFx('✨');

  try {
    const newBal = uData.kiBalance + 1;
    await db.collection('users').doc(me.uid).update({ kiBalance: newBal, lastDailyKi: today() });
    uData.kiBalance = newBal; uData.lastDailyKi = today();
    renderKi(); setCanDay(false); toast('기를 받았어요! +1기');
  } catch(e) { toast('오류: ' + e.message); }
  finally { dayBusy = false; }
}

/* ─── 탭 전환 ─── */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`tbtn-${name}`).classList.add('active');
  if (name === 'write') {
    updateKiPickDisplay(); updateSubmitBtn();
  }
  if (name === 'post')  { loadTopPosts(); }
}

/* ─── 홈탭 자랑글 피드 로드 ─── */
async function loadFeed() {
  const wrap = document.getElementById('feed-wrap');
  const feed = document.getElementById('post-feed');
  feed.innerHTML = '';

  try {
    // 복합 인덱스 불필요: 단일 inequality 쿼리만 사용, 정렬은 클라이언트에서
    const snap = await db.collection('posts')
      .where('kiRemaining', '>', 0)
      .get();

    const all = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.authorId !== me.uid && !p.authorBanned);

    // 일반 유저 글 우선, 없으면 관리자 글
    const userPosts  = all.filter(p => !p.isAdmin);
    const adminPosts = all.filter(p =>  p.isAdmin);
    const pool = userPosts.length > 0 ? userPosts : adminPosts;

    if (pool.length === 0) {
      wrap.style.display = 'none';
      return;
    }

    // 랜덤으로 1개 선택
    const p = pool[Math.floor(Math.random() * pool.length)];
    const alreadyClaimedToday = uData.lastClaimDate === today();

    wrap.style.display = 'block';
    const div = document.createElement('div');
    div.className = 'feed-card';
    div.innerHTML = `
      ${p.isAdmin ? '' : `<div class="feed-top"><span class="feed-badge">🔮 ${p.kiRemaining}기 남음</span></div>`}
      <div class="feed-body">${esc(p.content)}</div>
      <button id="claim-${p.id}"
        class="btn-feed-claim ${alreadyClaimedToday ? 'done' : 'on'}"
        onclick="claimKi('${p.id}')"
        ${alreadyClaimedToday ? 'disabled' : ''}>
        ${alreadyClaimedToday ? '✅ 오늘 기를 받았어요' : '🙏 이 글에서 기 받기 (+1기)'}
      </button>`;
    feed.appendChild(div);
  } catch(e) {
    wrap.style.display = 'none';
    console.warn('피드 로드 오류:', e.message);
  }
}

/* ─── 자랑글에서 기 받기 (Firestore 트랜잭션) ─── */
async function claimKi(postId) {
  const btn = document.getElementById(`claim-${postId}`);
  if (!btn || btn.disabled) return;
  btn.disabled = true; btn.textContent = '받는 중...';

  const postRef  = db.collection('posts').doc(postId);
  const claimRef = postRef.collection('dailyClaims').doc(`${today()}_${me.uid}`);
  const userRef  = db.collection('users').doc(me.uid);

  try {
    await db.runTransaction(async t => {
      const [postSnap, claimSnap, userSnap] = await Promise.all([
        t.get(postRef), t.get(claimRef), t.get(userRef)
      ]);

      if (!postSnap.exists)      throw new Error('글이 없습니다');
      if (userSnap.data().lastClaimDate === today()) throw new Error('오늘은 이미 기를 받았어요');
      const postData = postSnap.data();
      if (!postData.isAdmin && postData.kiRemaining <= 0) throw new Error('기가 모두 소진되었습니다');
      if (postData.authorId === me.uid) throw new Error('내 글에서는 받을 수 없어요');

      if (!postData.isAdmin) t.update(postRef, { kiRemaining: postData.kiRemaining - 1 });
      t.set(claimRef, { uid: me.uid, postId, date: today(),
                        claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
      t.update(userRef, { kiBalance: userSnap.data().kiBalance + 1, lastClaimDate: today() });
    });

    uData.kiBalance += 1;
    uData.lastClaimDate = today();
    renderKi();
    showFx('🙏');
    toast('자랑글에서 기를 받았어요! +1기');

    // 모든 기 받기 버튼 비활성화
    document.querySelectorAll('.btn-feed-claim').forEach(b => {
      b.className = 'btn-feed-claim done';
      b.disabled  = true;
      b.textContent = '✅ 오늘 기를 받았어요';
    });

  } catch(e) {
    toast(e.message);
    btn.disabled = false;
    btn.textContent = '🙏 이 글에서 기 받기 (+1기)';
  }
}

/* ─── 콘텐츠 필터 ─── */
function checkContent(text) {
  const t = text.trim();

  // 1. 최소 길이
  if (t.length < 5) return '내용이 너무 짧아요 (5자 이상)';

  // 2. URL / 링크 스팸
  if (/https?:\/\/|www\.|\.com|\.net|\.kr|bit\.ly/i.test(t))
    return '링크는 포함할 수 없어요';

  // 3. 연속 반복 문자 (같은 글자 8개 이상)
  if (/(.)\1{7,}/.test(t))
    return '반복되는 내용은 올릴 수 없어요';

  // 4. 자음/모음 연타 스팸 (ㅋㅋㅋ, ㅎㅎㅎ 등 6개 이상)
  if (/[ㄱ-ㅎㅏ-ㅣ]{6,}/.test(t))
    return '의미 없는 내용은 올릴 수 없어요';

  // 5. 성적·폭력적 키워드
  const banned = [
    // 성적
    '섹스','섹ㅅ','성교','야동','포르노','porn','sex','nude','성기','음경','음부',
    '보지','자지','씹','정액','사정','자위','오르가','딜도','콘돔착용','원나잇','원나이트',
    '조건만남','만남구함','만남구해','빨아줄','핥아줄','삽입','강간','성폭','윤간',
    // 폭력·혐오
    '죽여버','죽여줄','죽고싶','죽을래','패죽','칼로찌','총으로','폭탄','테러',
    '자살방법','자해','살인','학살','폭행','린치','고문',
    // 심한 욕설
    '개새끼','개색끼','씨발','ㅅㅂ','sibal','존나','좆','보지같','보지년',
    '창녀','걸레년','병신새','뇌졸','애미뒤','애비없는',
  ];

  const normalized = t.toLowerCase().replace(/\s+/g, '');
  for (const word of banned) {
    if (normalized.includes(word.toLowerCase().replace(/\s+/g, '')))
      return '부적절한 내용이 포함되어 있어요';
  }

  return null; // 통과
}

/* ─── ki 피커 ─── */
function adjustKi(delta) {
  const max = uData?.kiBalance || 0;
  kiPick = Math.min(Math.max(1, kiPick + delta), Math.max(1, max));
  updateKiPickDisplay();
  updateSubmitBtn();
}
function updateKiPickDisplay() {
  document.getElementById('kp-num').textContent  = kiPick;
  document.getElementById('kp-hint').textContent = `현재 보유: ${uData?.kiBalance||0}기 · ${kiPick}기 소모`;
}

/* ─── 쓰기 ─── */
const writeArea = document.getElementById('write-area');
writeArea.addEventListener('input', () => {
  document.getElementById('char-cnt').textContent = writeArea.value.length;
  updateSubmitBtn();
});

function updateSubmitBtn() {
  const btn = document.getElementById('submit-btn');
  const ok  = uData && uData.kiBalance >= kiPick && kiPick >= 1 && writeArea.value.trim().length > 0;
  btn.className  = `btn-submit ${ok?'on':'off'}`;
  btn.textContent = ok ? `✨ 자랑글 올리기 (${kiPick}기 소모)` : '✨ 자랑글 올리기';
}

async function submitPost() {
  const content = writeArea.value.trim();
  if (!content || !uData || uData.kiBalance < kiPick || kiPick < 1) return;

  if (uData.banned) { toast('🚫 글쓰기 권한이 없어요'); return; }

  const filterMsg = checkContent(content);
  if (filterMsg) { toast('🚫 ' + filterMsg); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '올리는 중...';

  try {
    const newBal = uData.kiBalance - kiPick;
    const batch  = db.batch();
    batch.update(db.collection('users').doc(me.uid), { kiBalance: newBal });
    batch.set(db.collection('posts').doc(), {
      authorId:    me.uid,
      authorName:  uData.displayName,
      content,
      date:        today(),
      kiPool:      kiPick,
      kiRemaining: kiPick,
      createdAt:   firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();

    const usedKi = kiPick;
    uData.kiBalance = newBal;
    kiPick = 1;
    writeArea.value = '';
    document.getElementById('char-cnt').textContent = '0';
    renderKi(); updateKiPickDisplay();
    showFx('📮');
    toast(`자랑글을 올렸어요! -${usedKi}기`);
    switchTab('home');
  } catch(e) { toast('오류: ' + e.message); }
  finally { btn.disabled = false; updateSubmitBtn(); }
}

/* ─── 자랑글 랭킹 ─── */
async function loadTopPosts() {
  const container = document.getElementById('top-posts');
  container.innerHTML = '<div class="post-loading">불러오는 중...</div>';

  try {
    const snap = await db.collection('posts').get();

    const posts = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(p => !p.authorBanned)
      .map(p => ({ ...p, kiClaimed: (p.kiPool || 0) - (p.kiRemaining || 0) }))
      .filter(p => p.kiClaimed > 0)
      .sort((a, b) => b.kiClaimed - a.kiClaimed)
      .slice(0, 10);

    if (posts.length === 0) {
      container.innerHTML = '<div class="rank-empty">아직 기를 받아간 자랑글이 없어요 🙏<br>첫 번째 주인공이 되어보세요!</div>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    container.innerHTML = posts.map((p, i) => `
      <div class="rank-card">
        <div class="rank-num">${medals[i] || `${i+1}`}</div>
        <div class="rank-body">
          <div class="rank-text">${esc(p.content)}</div>
          <div class="rank-stat">
            <span class="ki-got">🙏 ${p.kiClaimed}기 전달됨</span>
            <span>잔여 ${p.kiRemaining}기</span>
          </div>
        </div>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = '<div class="rank-empty">불러오기 실패. 잠시 후 다시 시도해주세요.</div>';
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
